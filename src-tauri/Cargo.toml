[package]
name = "jiaqing-game"
version = "1.0.0"
description = "嘉庆君游台湾：御前争霸"
authors = ["Red Seed Media"]
edition = "2021"

[lib]
name = "jiaqing_game_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
