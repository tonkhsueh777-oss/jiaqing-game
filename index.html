<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06171c">
  <title>嘉庆君游台湾：御前争霸</title>
  <link rel="stylesheet" href="styles.css?v=12">
  <link rel="stylesheet" href="v13-reset.css?v=13">
  <link rel="stylesheet" href="v13-layout.css?v=13">
  <link rel="stylesheet" href="v13-board.css?v=13">
  <link rel="stylesheet" href="v13-controls.css?v=13">
  <link rel="stylesheet" href="v13-responsive.css?v=13">
  <link rel="stylesheet" href="v13-treasure-status.css?v=14">
  <link rel="stylesheet" href="v15-board-compact.css?v=15">
  <link rel="stylesheet" href="v16-reference-layout.css?v=16">
  <link rel="stylesheet" href="v17-tight-layout.css?v=17">
  <link rel="stylesheet" href="v18-left-reference.css?v=18">
  <link rel="stylesheet" href="v19-left-fit.css?v=19">
  <link rel="stylesheet" href="v20-left-icons.css?v=21">
  <link rel="stylesheet" href="v22-draw-ritual.css?v=22">
  <link rel="stylesheet" href="v23-visual-effects.css?v=23">
  <link rel="stylesheet" href="v25-mobile-responsive.css?v=29">
  <link rel="stylesheet" href="v28-mobile-cross-board.css?v=29">
  <link rel="stylesheet" href="v30-beginner-assist.css?v=30">
  <link rel="stylesheet" href="v31-analytics-feedback.css?v=31">
</head>
<body>
  <div id="app" class="game-shell">
    <aside class="left-dashboard" aria-label="牌局信息">
      <div class="brand-block">
        <h1>嘉庆君游台湾：御前争霸</h1>
        <p>御前圣物争夺 · 单机三人局</p>
      </div>

      <section class="dashboard-panel round-panel">
        <div class="panel-heading">回合状态</div>
        <div id="turn-banner" class="turn-banner" aria-live="polite">准备开局</div>
      </section>

      <section class="dashboard-panel players-overview-panel">
        <div class="panel-heading">玩家一览</div>
        <div id="player-overview" class="player-overview"></div>
      </section>

      <section class="dashboard-panel treasure-overview-panel">
        <div class="panel-heading">宝物总览</div>
        <div id="treasure-overview" class="treasure-overview"></div>
      </section>

      <section class="dashboard-panel pile-info-panel">
        <div class="panel-heading">牌堆信息</div>
        <div class="pile-rail" aria-label="牌堆状态">
          <div id="draw-pile" class="pile-card"></div>
          <div id="discard-pile" class="pile-card"></div>
        </div>
      </section>

      <section id="game-log" class="game-log dashboard-panel" aria-label="行动记录"></section>

      <div class="left-actions">
        <button id="btn-rules" class="ghost-button" type="button">规则说明</button>
        <button id="btn-new-game" class="ghost-button" type="button">新游戏</button>
      </div>
    </aside>

    <main class="main-dashboard">
      <!-- Hidden interaction sources retained so target-selection logic stays intact. -->
      <section class="top-dashboard-row" aria-hidden="true">
        <section class="dashboard-panel inventory-panel">
          <div class="panel-heading">宝物库存</div>
          <div id="treasure-bar" class="treasure-bar" aria-label="中央圣物库"></div>
        </section>
        <section class="ai-status-strip" aria-label="AI玩家状态">
          <aside id="ai-left" class="player-panel player-panel--left" aria-label="AI玩家一"></aside>
          <aside id="ai-right" class="player-panel player-panel--right" aria-label="AI玩家二"></aside>
        </section>
      </section>

      <section class="board-stage dashboard-panel" aria-label="中央棋盘">
        <div id="board-wrap" class="board-wrap">
          <div id="board-overlay" class="board-overlay"></div>
        </div>
      </section>

      <section class="hand-dashboard dashboard-panel" aria-label="玩家手牌区">
        <div id="hand-title" class="panel-heading hand-heading">玩家（你）手牌</div>
        <section id="human-panel" class="human-panel" aria-label="玩家操作区"></section>
        <div class="hand-side-note" aria-hidden="true">
          <span class="hand-side-note__mark">御</span>
          <p>手牌上限：3 张<br>出牌后自动补至 3 张</p>
        </div>
      </section>
    </main>

    <aside class="right-dashboard" aria-label="当前操作">
      <section class="dashboard-panel operation-panel">
        <div class="panel-heading">当前操作</div>
        <div class="panel-subheading">牌面预览</div>
        <div id="selected-card-preview" class="selected-card-preview"></div>
      </section>

      <section class="dashboard-panel guide-panel">
        <div class="panel-heading">行动说明</div>
        <div id="action-guide" class="action-guide"></div>
      </section>

      <section class="dashboard-panel controls-panel">
        <div class="panel-heading">可执行动作</div>
        <div id="action-controls" class="action-controls"></div>
      </section>
    </aside>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root" class="modal-root" aria-live="assertive"></div>

  <script src="src/namespace.js?v=13"></script>
  <script src="src/v30-beginner-assist-logic.js?v=30"></script>
  <script src="src/v31-analytics-logic.js?v=31"></script>
  <script src="src/v25-mobile-layout.js?v=29"></script>
  <script src="src/catalog.js?v=13"></script>
  <script src="src/draw-ritual.js?v=22"></script>
  <script src="src/v23-visual-effects-logic.js?v=24"></script>
  <script src="src/state.js?v=13"></script>
  <script src="src/rules.js?v=13"></script>
  <script src="src/ai.js?v=13"></script>
  <script src="src/storage.js?v=13"></script>
  <script src="src/ui.js?v=27"></script>
  <script src="src/v13-ui.js?v=16"></script>
  <script src="src/v15-board-ui.js?v=17"></script>
  <script src="src/v18-left-ui.js?v=21"></script>
  <script src="src/v22-draw-ritual-ui.js?v=22"></script>
  <script src="src/v23-visual-effects.js?v=23"></script>
  <script src="src/v25-mobile-ui.js?v=29"></script>
  <script src="src/v30-beginner-assist-ui.js?v=30"></script>
  <script src="src/v31-analytics-client.js?v=31"></script>
  <script src="src/v31-analytics-ui.js?v=31"></script>
  <script src="src/v31-analytics-hooks.js?v=31"></script>
  <script src="src/main.js?v=22"></script>
</body>
</html>
