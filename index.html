<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b25">
  <title>嘉庆君游台湾：御前争霸</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="game-shell">
    <header class="game-header">
      <div class="brand-block">
        <h1>嘉庆君游台湾：御前争霸</h1>
        <p>御前圣物争夺 · 单机三人局</p>
      </div>
      <div id="turn-banner" class="turn-banner" aria-live="polite">准备开局</div>
      <div class="header-actions">
        <button id="btn-rules" class="ghost-button" type="button">规则</button>
        <button id="btn-new-game" class="ghost-button" type="button">新游戏</button>
      </div>
    </header>

    <aside id="ai-left" class="player-panel player-panel--left" aria-label="AI玩家一"></aside>

    <main class="table-area">
      <section id="treasure-bar" class="treasure-bar" aria-label="中央圣物库"></section>
      <section class="board-stage" aria-label="中央棋盘">
        <div id="board-wrap" class="board-wrap">
          <div id="board-overlay" class="board-overlay"></div>
        </div>
        <div class="pile-rail" aria-label="牌堆状态">
          <div id="draw-pile" class="pile-card"></div>
          <div id="discard-pile" class="pile-card"></div>
        </div>
      </section>
      <section id="game-log" class="game-log" aria-label="行动记录"></section>
    </main>

    <aside id="ai-right" class="player-panel player-panel--right" aria-label="AI玩家二"></aside>

    <section id="human-panel" class="human-panel" aria-label="玩家操作区"></section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root" class="modal-root" aria-live="assertive"></div>

  <script src="src/namespace.js"></script>
  <script src="src/assets-data-1.js"></script>
  <script src="src/assets-data-2.js"></script>
  <script src="src/assets-data-3.js"></script>
  <script src="src/assets-data-4.js"></script>
  <script src="src/assets-data-5.js"></script>
  <script src="src/assets-data-6.js"></script>
  <script src="src/assets-data-7.js"></script>
  <script src="src/assets-data-8.js"></script>
  <script src="src/catalog.js"></script>
  <script src="src/state.js"></script>
  <script src="src/rules.js"></script>
  <script src="src/ai.js"></script>
  <script src="src/storage.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
